<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký | TIMEHOUSE</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <noscript><div style="padding:12px;background:#111;color:#fff;text-align:center">Vui lòng bật JavaScript để sử dụng website TIMEHOUSE.</div></noscript>
  <div id="site-header"></div>

  <main class="auth-wrap">
    <div class="container">
      <div class="auth-card">
        <h1 class="text-center">Tạo tài khoản</h1>
        <p class="text-center text-muted-2 mb-4">Đăng ký để mua hàng, lưu yêu thích và nhận ưu đãi thành viên</p>
        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="name">Họ và tên</label>
            <input type="text" class="form-control" id="name" autocomplete="name" required>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label" for="email">Email</label>
              <input type="email" class="form-control" id="email" autocomplete="email" required>
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="phone">Số điện thoại</label>
              <input type="tel" class="form-control" id="phone" autocomplete="tel" placeholder="0xxxxxxxxx" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Mật khẩu</label>
            <div class="position-relative">
              <input type="password" class="form-control pe-5" id="password" autocomplete="new-password" required>
              <button type="button" class="pw-toggle" data-target="password" aria-label="Hiện mật khẩu"><i class="bi bi-eye"></i></button>
            </div>
            <div class="form-text">Tối thiểu 6 ký tự.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password2">Nhập lại mật khẩu</label>
            <input type="password" class="form-control" id="password2" autocomplete="new-password" required>
          </div>
          <div class="form-check mb-3 small">
            <input class="form-check-input" type="checkbox" id="agree">
            <label class="form-check-label" for="agree">Tôi đồng ý với <a href="chinh-sach.html#bao-mat" class="text-decoration-underline">chính sách bảo mật</a> của TIMEHOUSE</label>
          </div>
          <button type="submit" class="btn btn-dark w-100 btn-lg">Đăng ký</button>
        </form>
        <p class="text-center mt-4">Đã có tài khoản? <a href="dang-nhap.html" class="fw-semibold text-decoration-underline" id="toLogin">Đăng nhập</a></p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/data/cai-dat.js"></script>
  <script src="assets/data/danh-muc.js"></script>
  <script src="assets/data/thuong-hieu.js"></script>
  <script src="assets/data/san-pham.js"></script>
  <script src="assets/data/nguoi-dung.js"></script>
  <script src="assets/data/khuyen-mai.js"></script>
  <script src="assets/data/bai-viet.js"></script>
  <script src="assets/data/danh-gia.js"></script>
  <script src="assets/data/don-hang.js"></script>
  <script src="assets/js/tien-ich.js"></script>
  <script src="assets/js/luu-tru.js"></script>
  <script src="assets/js/xac-thuc.js"></script>
  <script src="assets/js/danh-muc-san-pham.js"></script>
  <script src="assets/js/gio-hang.js"></script>
  <script src="assets/js/thanh-phan.js"></script>
  <script src="assets/js/pages/trang-xac-thuc.js"></script>
</body>
</html>
