<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | TIMEHOUSE</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <noscript><div style="padding:12px;background:#111;color:#fff;text-align:center">Vui lòng bật JavaScript để sử dụng website TIMEHOUSE.</div></noscript>
  <div id="site-header"></div>

  <main class="auth-wrap">
    <div class="container">
      <div class="auth-card">
        <h1 class="text-center">Đăng nhập</h1>
        <p class="text-center text-muted-2 mb-4">Chào mừng bạn quay lại TIMEHOUSE</p>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="account">Email hoặc số điện thoại</label>
            <input type="text" class="form-control" id="account" autocomplete="username" required>
          </div>
          <div class="mb-2">
            <label class="form-label" for="password">Mật khẩu</label>
            <div class="position-relative">
              <input type="password" class="form-control pe-5" id="password" autocomplete="current-password" required>
              <button type="button" class="pw-toggle" data-target="password" aria-label="Hiện mật khẩu"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3 small">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" checked>
              <label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label>
            </div>
            <a href="#" class="text-decoration-underline" data-bs-toggle="modal" data-bs-target="#forgotModal">Quên mật khẩu?</a>
          </div>
          <div class="alert alert-danger py-2 small d-none" id="loginError"></div>
          <button type="submit" class="btn btn-dark w-100 btn-lg">Đăng nhập</button>
        </form>
        <p class="text-center mt-4 mb-4">Chưa có tài khoản? <a href="dang-ky.html" class="fw-semibold text-decoration-underline" id="toRegister">Đăng ký ngay</a></p>

        <div class="demo-accounts">
          <div class="fw-semibold mb-1"><i class="bi bi-info-circle me-1"></i>Tài khoản dùng thử (mật khẩu 123456)</div>
          <div id="demoList"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Quên mật khẩu (mô phỏng) -->
  <div class="modal fade" id="forgotModal" tabindex="-1" aria-labelledby="forgotTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <form id="forgotForm" novalidate>
        <div class="modal-header border-0"><h5 class="modal-title" id="forgotTitle">Quên mật khẩu</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
        <div class="modal-body pt-0">
          <p class="small text-muted-2">Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</p>
          <input type="email" class="form-control" id="forgotEmail" placeholder="Email" required>
        </div>
        <div class="modal-footer border-0"><button type="submit" class="btn btn-dark w-100">Gửi liên kết</button></div>
      </form>
    </div></div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/data/cai-dat.js"></script>
  <script src="assets/data/danh-muc.js"></script>
  <script src="assets/data/thuong-hieu.js"></script>
  <script src="assets/data/san-pham.js"></script>
  <script src="assets/data/nguoi-dung.js"></script>
  <script src="assets/data/khuyen-mai.js"></script>
  <script src="assets/data/bai-viet.js"></script>
  <script src="assets/data/danh-gia.js"></script>
  <script src="assets/data/don-hang.js"></script>
  <script src="assets/js/tien-ich.js"></script>
  <script src="assets/js/luu-tru.js"></script>
  <script src="assets/js/xac-thuc.js"></script>
  <script src="assets/js/danh-muc-san-pham.js"></script>
  <script src="assets/js/gio-hang.js"></script>
  <script src="assets/js/thanh-phan.js"></script>
  <script src="assets/js/pages/trang-xac-thuc.js"></script>
</body>
</html>
