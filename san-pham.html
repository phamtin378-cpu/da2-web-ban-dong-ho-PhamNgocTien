<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm | TIMEHOUSE</title>
  <meta name="description" content="Danh sách đồng hồ chính hãng tại TIMEHOUSE: lọc theo thương hiệu, giá, loại máy, kích thước và nhiều tiêu chí khác.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <noscript><div style="padding:12px;background:#111;color:#fff;text-align:center">Vui lòng bật JavaScript để sử dụng website TIMEHOUSE.</div></noscript>
  <div id="site-header"></div>

  <main>
    <section class="page-head">
      <div class="container">
        <nav aria-label="breadcrumb"><ol class="breadcrumb" id="breadcrumb"></ol></nav>
        <h1 class="page-title" id="pageTitle">Tất cả sản phẩm</h1>
        <p class="text-muted-2 mb-0 mt-2" id="pageDesc"></p>
        <div class="chip-links mt-3" id="subCats"></div>
      </div>
    </section>

    <!-- Danh sách thương hiệu (san-pham.html?view=brands) -->
    <section class="section-sm" id="brandView" hidden>
      <div class="container"><div class="row g-3" id="brandGrid"></div></div>
    </section>

    <section class="section-sm" id="listView">
      <div class="container">
        <div class="row g-4">
          <!-- Bộ lọc: cột trái trên desktop, ngăn kéo trên mobile -->
          <aside class="col-lg-3">
            <div class="offcanvas-lg offcanvas-start" tabindex="-1" id="filterPanel" aria-labelledby="filterTitle">
              <div class="offcanvas-header border-bottom">
                <h5 class="offcanvas-title" id="filterTitle">Bộ lọc</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#filterPanel" aria-label="Đóng"></button>
              </div>
              <div class="offcanvas-body d-block p-3 p-lg-0">
                <div id="filters"></div>
              </div>
              <div class="offcanvas-footer d-lg-none p-3 border-top d-flex gap-2">
                <button class="btn btn-outline-dark flex-fill js-clear-all">Xóa lọc</button>
                <button class="btn btn-dark flex-fill" data-bs-dismiss="offcanvas" data-bs-target="#filterPanel">Xem <span class="js-count"></span> sản phẩm</button>
              </div>
            </div>
          </aside>

          <div class="col-lg-9">
            <div class="list-toolbar">
              <button class="btn btn-outline-dark btn-sm d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#filterPanel"><i class="bi bi-sliders me-1"></i>Bộ lọc <span class="badge text-bg-dark ms-1 js-filter-badge" hidden></span></button>
              <div class="small text-muted-2 d-none d-lg-block"><span class="js-count fw-semibold text-dark"></span> sản phẩm</div>
              <div class="d-flex align-items-center gap-2 ms-auto">
                <label for="sortSelect" class="small text-muted-2 d-none d-sm-inline">Sắp xếp</label>
                <select class="form-select form-select-sm" id="sortSelect" style="width:auto">
                  <option value="">Nổi bật</option>
                  <option value="newest">Mới nhất</option>
                  <option value="bestseller">Bán chạy</option>
                  <option value="price-asc">Giá tăng dần</option>
                  <option value="price-desc">Giá giảm dần</option>
                  <option value="discount">Giảm giá nhiều</option>
                  <option value="rating">Đánh giá cao</option>
                </select>
                <div class="btn-group view-toggle d-none d-sm-flex" role="group" aria-label="Kiểu hiển thị">
                  <button class="btn btn-sm" data-view="grid" title="Dạng lưới" aria-label="Dạng lưới"><i class="bi bi-grid-3x3-gap"></i></button>
                  <button class="btn btn-sm" data-view="list" title="Dạng danh sách" aria-label="Dạng danh sách"><i class="bi bi-list-ul"></i></button>
                </div>
              </div>
            </div>
            <div class="active-filters" id="activeFilters"></div>
            <div class="product-grid grid-3" id="productGrid"></div>
            <div class="mt-5" id="pagination"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/data/cai-dat.js"></script>
  <script src="assets/data/danh-muc.js"></script>
  <script src="assets/data/thuong-hieu.js"></script>
  <script src="assets/data/san-pham.js"></script>
  <script src="assets/data/nguoi-dung.js"></script>
  <script src="assets/data/khuyen-mai.js"></script>
  <script src="assets/data/bai-viet.js"></script>
  <script src="assets/data/danh-gia.js"></script>
  <script src="assets/data/don-hang.js"></script>
  <script src="assets/js/tien-ich.js"></script>
  <script src="assets/js/luu-tru.js"></script>
  <script src="assets/js/xac-thuc.js"></script>
  <script src="assets/js/danh-muc-san-pham.js"></script>
  <script src="assets/js/gio-hang.js"></script>
  <script src="assets/js/thanh-phan.js"></script>
  <script src="assets/js/pages/san-pham.js"></script>
</body>
</html>
