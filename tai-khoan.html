<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài khoản của tôi | TIMEHOUSE</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <noscript><div style="padding:12px;background:#111;color:#fff;text-align:center">Vui lòng bật JavaScript để sử dụng website TIMEHOUSE.</div></noscript>
  <div id="site-header"></div>

  <main class="section-sm">
    <div class="container">
      <div class="row g-4">
        <aside class="col-lg-3">
          <div class="acc-side">
            <div class="acc-user">
              <span class="avatar-lg" id="accAvatar"></span>
              <div class="min-w-0"><div class="fw-semibold text-truncate" id="accName"></div><div class="small text-muted-2" id="accSince"></div></div>
            </div>
            <nav class="acc-nav" id="accNav" aria-label="Tài khoản">
              <a href="#profile" data-tab="profile"><i class="bi bi-person"></i>Hồ sơ của tôi</a>
              <a href="#orders" data-tab="orders"><i class="bi bi-receipt"></i>Đơn hàng<span class="acc-count" id="navOrders"></span></a>
              <a href="#reviews" data-tab="reviews"><i class="bi bi-star"></i>Đánh giá của tôi<span class="acc-count" id="navReviews"></span></a>
              <a href="#coupons" data-tab="coupons"><i class="bi bi-ticket-perforated"></i>Ví mã giảm giá</a>
              <a href="#addresses" data-tab="addresses"><i class="bi bi-geo-alt"></i>Sổ địa chỉ</a>
              <a href="yeu-thich.html"><i class="bi bi-heart"></i>Sản phẩm yêu thích</a>
              <a href="#password" data-tab="password"><i class="bi bi-shield-lock"></i>Đổi mật khẩu</a>
              <button type="button" class="js-logout"><i class="bi bi-box-arrow-right"></i>Đăng xuất</button>
            </nav>
          </div>
        </aside>
        <section class="col-lg-9" id="accContent" aria-live="polite"></section>
      </div>
    </div>
  </main>

  <!-- Thêm / sửa địa chỉ -->
  <div class="modal fade" id="addressModal" tabindex="-1" aria-labelledby="addressTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <form id="addressForm" novalidate>
        <div class="modal-header"><h5 class="modal-title" id="addressTitle">Thêm địa chỉ</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-sm-6"><label class="form-label" for="adName">Họ tên</label><input type="text" class="form-control" id="adName"></div>
            <div class="col-sm-6"><label class="form-label" for="adPhone">Số điện thoại</label><input type="tel" class="form-control" id="adPhone"></div>
            <div class="col-sm-6"><label class="form-label" for="adProvince">Tỉnh / Thành phố</label><select class="form-select" id="adProvince"><option value="">-- Chọn --</option></select></div>
            <div class="col-sm-6"><label class="form-label" for="adWard">Phường / Xã</label><input type="text" class="form-control" id="adWard"></div>
            <div class="col-12"><label class="form-label" for="adStreet">Địa chỉ cụ thể</label><input type="text" class="form-control" id="adStreet" placeholder="Số nhà, tên đường…"></div>
            <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="adDefault"><label class="form-check-label" for="adDefault">Đặt làm địa chỉ mặc định</label></div></div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Hủy</button><button type="submit" class="btn btn-dark">Lưu địa chỉ</button></div>
      </form>
    </div></div>
  </div>

  <!-- Hủy đơn -->
  <div class="modal fade" id="cancelModal" tabindex="-1" aria-labelledby="cancelTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <form id="cancelForm" novalidate>
        <div class="modal-header"><h5 class="modal-title" id="cancelTitle">Hủy đơn hàng <span id="cancelId"></span></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
        <div class="modal-body">
          <p class="small text-muted-2">Vui lòng cho chúng tôi biết lý do hủy đơn:</p>
          <div class="d-grid gap-2" id="cancelReasons"></div>
          <textarea class="form-control mt-2" id="cancelOther" rows="2" placeholder="Lý do khác…" hidden></textarea>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Không hủy</button><button type="submit" class="btn btn-danger">Xác nhận hủy</button></div>
      </form>
    </div></div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/data/cai-dat.js"></script>
  <script src="assets/data/danh-muc.js"></script>
  <script src="assets/data/thuong-hieu.js"></script>
  <script src="assets/data/san-pham.js"></script>
  <script src="assets/data/nguoi-dung.js"></script>
  <script src="assets/data/khuyen-mai.js"></script>
  <script src="assets/data/bai-viet.js"></script>
  <script src="assets/data/danh-gia.js"></script>
  <script src="assets/data/don-hang.js"></script>
  <script src="assets/js/tien-ich.js"></script>
  <script src="assets/js/luu-tru.js"></script>
  <script src="assets/js/xac-thuc.js"></script>
  <script src="assets/js/danh-muc-san-pham.js"></script>
  <script src="assets/js/danh-gia.js"></script>
  <script src="assets/js/gio-hang.js"></script>
  <script src="assets/js/dat-hang.js"></script>
  <script src="assets/js/thanh-phan.js"></script>
  <script src="assets/js/pages/tai-khoan.js"></script>
</body>
</html>
