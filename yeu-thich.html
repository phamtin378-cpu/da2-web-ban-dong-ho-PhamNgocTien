<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm yêu thích | TIMEHOUSE</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <noscript><div style="padding:12px;background:#111;color:#fff;text-align:center">Vui lòng bật JavaScript để sử dụng website TIMEHOUSE.</div></noscript>
  <div id="site-header"></div>

  <main>
    <section class="page-head">
      <div class="container">
        <nav aria-label="breadcrumb"><ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
          <li class="breadcrumb-item active" aria-current="page">Yêu thích</li>
        </ol></nav>
        <div class="d-flex justify-content-between align-items-end flex-wrap gap-2">
          <h1 class="page-title">Sản phẩm yêu thích <span class="text-muted-2 fw-normal fs-5" id="wishCount"></span></h1>
          <button class="btn btn-dark btn-sm" id="addAll" hidden><i class="bi bi-bag-plus me-1"></i>Thêm tất cả vào giỏ</button>
        </div>
      </div>
    </section>
    <section class="section-sm">
      <div class="container"><div class="product-grid" id="wishGrid"></div></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/data/cai-dat.js"></script>
  <script src="assets/data/danh-muc.js"></script>
  <script src="assets/data/thuong-hieu.js"></script>
  <script src="assets/data/san-pham.js"></script>
  <script src="assets/data/nguoi-dung.js"></script>
  <script src="assets/data/khuyen-mai.js"></script>
  <script src="assets/data/bai-viet.js"></script>
  <script src="assets/data/danh-gia.js"></script>
  <script src="assets/data/don-hang.js"></script>
  <script src="assets/js/tien-ich.js"></script>
  <script src="assets/js/luu-tru.js"></script>
  <script src="assets/js/xac-thuc.js"></script>
  <script src="assets/js/danh-muc-san-pham.js"></script>
  <script src="assets/js/gio-hang.js"></script>
  <script src="assets/js/thanh-phan.js"></script>
  <script>
    Layout.init();
    (function () {
      const grid = $('#wishGrid');
      const u = Auth.user();
      if (!u || u.role !== 'customer') {
        grid.outerHTML = `<div class="empty-state"><i class="bi bi-heart"></i>
          <div class="fw-semibold text-dark mb-1">Đăng nhập để xem sản phẩm yêu thích</div>
          <div class="mb-3">Lưu lại những mẫu đồng hồ bạn thích và mua sau.</div>
          <a href="${Auth.loginUrl()}" class="btn btn-dark">Đăng nhập</a></div>`;
        return;
      }
      function render() {
        const list = Wishlist.ids().map(Catalog.product).filter(p => p && p.status === 'active');
        $('#wishCount').textContent = list.length ? `(${list.length})` : '';
        $('#addAll').hidden = !list.some(p => p.stock > 0);
        grid.innerHTML = list.length ? list.map(productCard).join('') : `
          <div class="empty-state" style="grid-column:1/-1"><i class="bi bi-heart"></i>
            <div class="fw-semibold text-dark mb-1">Chưa có sản phẩm yêu thích</div>
            <div class="mb-3">Bấm biểu tượng <i class="bi bi-heart"></i> trên sản phẩm để lưu lại.</div>
            <a href="san-pham.html" class="btn btn-dark">Khám phá sản phẩm</a></div>`;
      }
      document.addEventListener('th:wishlist', render);
      $('#addAll').addEventListener('click', () => {
        const inCart = new Set(Cart.items().map(i => i.productId));
        let n = 0;
        Wishlist.ids().map(Catalog.product).forEach(p => {
          if (p && p.status === 'active' && p.stock > 0 && !inCart.has(p.id) && Cart.add(p.id, 1, { silent: true })) n++;
        });
        Utils.toast(n ? `Đã thêm ${n} sản phẩm vào giỏ hàng. <a href="gio-hang.html" class="link-dark fw-semibold">Xem giỏ</a>` : 'Các sản phẩm đã có sẵn trong giỏ hàng.', n ? 'success' : 'info');
      });
      render();
    })();
  </script>
</body>
</html>
